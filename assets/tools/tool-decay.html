
<div class='tool'>
 <div class='hg-h' style='margin-bottom:10px'>Decay &amp; hot-lab draw-back calculator</div>
 <div class='t-grid'>
  <div class='t-f'><label>Isotope</label><div class='t-in'><select id='dec-i'>
   <option value='109.8'>F-18 (110 min)</option><option value='68'>Ga-68 (68 min)</option>
   <option value='360'>Tc-99m (6.0 h)</option><option value='762'>Cu-64 (12.7 h)</option>
   <option value='792'>I-123 (13.2 h)</option><option value='11549'>I-131 (8.02 d)</option>
   <option value='9576'>Lu-177 (6.65 d)</option><option value='1.27'>Rb-82 (76 s)</option>
   <option value='16416'>Ra-223 (11.4 d)</option></select></div></div>
  <div class='t-f'><label>Current assayed activity (A&#8320;)</label><div class='t-in'><input type='number' id='dec-a' value='740' step='1'><span class='u'>MBq</span></div></div>
  <div class='t-f'><label>Time elapsed / until use</label><div class='t-in'><input type='number' id='dec-t' value='60' step='1'><select id='dec-u' style='border:0;background:transparent'><option value='1'>min</option><option value='60'>hours</option><option value='1440'>days</option></select></div></div>
  <div class='t-f'><label>Stock concentration (optional)</label><div class='t-in'><input type='number' id='dec-conc' value='0' step='1'><span class='u'>MBq/mL</span></div></div>
  <div class='t-f'><label>Desired activity at use</label><div class='t-in'><input type='number' id='dec-want' value='370' step='1'><span class='u'>MBq</span></div></div>
 </div>
 <div class='t-row' id='dec-row'></div>
 <div class='t-note'>Forward: A = A&#8320;&#183;e^(&#8722;0.693&#183;t/t&#189;). Draw-back: to deliver the desired activity <b>after</b> time t, draw more now (needed = desired &#247; decay factor); the volume uses the current stock concentration. Verify against your dose calibrator.</div>
</div>
<script>(function(){
var g=function(i){return document.getElementById(i);};
function f(){var hl=+g('dec-i').value,a=+g('dec-a').value,t=+g('dec-t').value*(+g('dec-u').value),conc=+g('dec-conc').value,want=+g('dec-want').value;
 var df=Math.pow(0.5,t/hl),remain=a*df,drawNow=df>0?want/df:0,vol=conc>0?drawNow/conc:0;
 var html='<div class="t-mini"><b>'+remain.toFixed(1)+'</b><span>remaining MBq @t</span></div>'+
  '<div class="t-mini"><b>'+(df*100).toFixed(1)+'%</b><span>decay factor</span></div>'+
  '<div class="t-mini"><b>'+drawNow.toFixed(1)+'</b><span>draw now for '+want+' MBq @t</span></div>';
 if(conc>0)html+='<div class="t-mini"><b>'+vol.toFixed(2)+'</b><span>mL to draw now</span></div>';
 g('dec-row').innerHTML=html;}
['dec-i','dec-a','dec-t','dec-u','dec-conc','dec-want'].forEach(function(i){g(i).addEventListener('input',f);});f();})();</script>
